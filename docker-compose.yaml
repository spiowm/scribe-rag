services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      # Дефолт — loopback; на сервері BIND_ADDR звужує порт до Tailscale.
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Інакше alembic стартує раніше, ніж база готова приймати зʼєднання.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    ports:
      # У qdrant немає авторизації: відкритий порт — це відкрита база знань.
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_HOST_PORT:-6333}:6333"
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      NOTION_TOKEN: ${NOTION_TOKEN:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      MONGO_URI: ${MONGO_URI:?}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${GOOGLE_DRIVE_CREDENTIALS_JSON:?}
      # робочі диски в пошуку (id через кому); порожньо — лише загальне
      GOOGLE_DRIVE_IDS: ${GOOGLE_DRIVE_IDS:-}
      GOOGLE_DRIVE_GENERAL_ID: ${GOOGLE_DRIVE_GENERAL_ID:-}
      GOOGLE_DRIVE_GENERAL_FOREIGN: ${GOOGLE_DRIVE_GENERAL_FOREIGN:-}
      GOOGLE_DRIVE_GENERAL_FOREIGN_LABEL: ${GOOGLE_DRIVE_GENERAL_FOREIGN_LABEL:-інші загальні джерела}
      GOOGLE_DRIVE_FULL_MEMBERS_GROUP: ${GOOGLE_DRIVE_FULL_MEMBERS_GROUP:-}
      GOOGLE_DRIVE_ADMIN_GROUP: ${GOOGLE_DRIVE_ADMIN_GROUP:-}
      GOOGLE_DRIVE_PAUSED_IDS: ${GOOGLE_DRIVE_PAUSED_IDS:-}
      # бази Notion таблицями: id[:властивість для поділу] через кому
      NOTION_DATABASE_IDS: ${NOTION_DATABASE_IDS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      KEYRING_PW: ${KEYRING_PW:-}
      # Обовʼязковий: без нього будь-хто з доступом до порту підставляє чужий
      # telegram_id і читає чужі диски. Локально — будь-який рядок.
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?задай INTERNAL_API_TOKEN, однаковий для backend і bot}"
    volumes:
      - agy_home:/home/app
    ports:
      # На сервері 8000 зайнятий самим Coolify, тому номер теж змінною.
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BOT_TOKEN: ${BOT_TOKEN:?}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?задай INTERNAL_API_TOKEN, однаковий для backend і bot}"
      # Coolify дописує кожному сервісу `env_file` з усіма змінними застосунку,
      # а `environment` має пріоритет. Секрети інших сервісів тому перекрито
      # явно. Непорожнім рядком: порожній Coolify 4.1.2 замінює значенням
      # змінної з панелі.
      POSTGRES_PASSWORD: unused
      NOTION_TOKEN: unused
      GEMINI_API_KEY: unused
      MONGO_URI: unused
      GOOGLE_DRIVE_CREDENTIALS_JSON: unused
      R2_ACCOUNT_ID: unused
      R2_ACCESS_KEY_ID: unused
      R2_SECRET_ACCESS_KEY: unused
      KEYRING_PW: unused
    depends_on:
      backend:
        condition: service_started

  mcp:
    # Той самий образ, що й backend, але запускає лише публічну частину:
    # MCP і OAuth. Домен дивиться сюди, backend лишається внутрішнім.
    build: ./backend
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "uvicorn", "src.public.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      MONGO_URI: ${MONGO_URI:?}
      PUBLIC_URL: ${MCP_PUBLIC_URL:?}
      # Не секрет: `who_am_i` з нього бачить, які диски підключені.
      GOOGLE_DRIVE_IDS: ${GOOGLE_DRIVE_IDS:-}
      GOOGLE_DRIVE_FULL_MEMBERS_GROUP: ${GOOGLE_DRIVE_FULL_MEMBERS_GROUP:-}
      GOOGLE_DRIVE_ADMIN_GROUP: ${GOOGLE_DRIVE_ADMIN_GROUP:-}
      GOOGLE_DRIVE_PAUSED_IDS: ${GOOGLE_DRIVE_PAUSED_IDS:-}
      # Публічному сервісу секрети Notion, Drive, R2, бота й внутрішнього API
      # не потрібні, а контейнер відкритий в інтернет. Coolify однаково
      # дописує `env_file` з усіма змінними застосунку, тому їх перекрито явно
      # (`environment` має пріоритет над `env_file`). Непорожнім рядком:
      # порожній Coolify 4.1.2 замінює значенням змінної з панелі.
      NOTION_TOKEN: unused
      GOOGLE_DRIVE_CREDENTIALS_JSON: unused
      R2_ACCOUNT_ID: unused
      R2_ACCESS_KEY_ID: unused
      R2_SECRET_ACCESS_KEY: unused
      BOT_TOKEN: unused
      INTERNAL_API_TOKEN: unused
      KEYRING_PW: unused
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8077}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      # Міграції застосовує backend при старті.
      backend:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  agy_home:
