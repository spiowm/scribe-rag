services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      # Дефолт — loopback; на сервері BIND_ADDR звужує порт до Tailscale.
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Інакше alembic стартує раніше, ніж база готова приймати зʼєднання.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    ports:
      # У qdrant немає авторизації: відкритий порт — це відкрита база знань.
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_HOST_PORT:-6333}:6333"
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      NOTION_TOKEN: ${NOTION_TOKEN:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      MONGO_URI: ${MONGO_URI:?}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${GOOGLE_DRIVE_CREDENTIALS_JSON:?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      KEYRING_PW: ${KEYRING_PW:-}
    volumes:
      - agy_home:/home/app
    ports:
      # На сервері 8000 зайнятий самим Coolify, тому номер теж змінною.
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BOT_TOKEN: ${BOT_TOKEN:?}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  agy_home:
