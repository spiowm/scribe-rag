services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      # Лише з самої машини: бекенд ходить у базу мережею compose, а назовні
      # порт потрібен хіба для psql чи DBeaver з ноута. Без 127.0.0.1 постгрес
      # слухає на всіх інтерфейсах.
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Без цього alembic у бекенді стартує раніше, ніж база готова.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    ports:
      # Те саме, і тут це важливіше: у qdrant за замовчуванням немає жодної
      # авторизації — хто дістав порт, той читає й пише всю базу знань.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      NOTION_TOKEN: ${NOTION_TOKEN:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      MONGO_URI: ${MONGO_URI:?}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${GOOGLE_DRIVE_CREDENTIALS_JSON:?}
      KEYRING_PW: ${KEYRING_PW:-}
    volumes:
      - agy_home:/home/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BOT_TOKEN: ${BOT_TOKEN:?}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  agy_home:
