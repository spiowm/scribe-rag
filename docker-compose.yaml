services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      # Лише з самої машини: бекенд ходить у базу мережею compose, а назовні
      # порт потрібен хіба для psql чи DBeaver з ноута. Без 127.0.0.1 постгрес
      # слухає на всіх інтерфейсах.
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Без цього alembic у бекенді стартує раніше, ніж база готова.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    ports:
      # Те саме, і тут це важливіше: у qdrant за замовчуванням немає жодної
      # авторизації — хто дістав порт, той читає й пише всю базу знань.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # Необовʼязковий: локально звідси беруться ключі, а в Coolify цього файлу
      # в клоні немає (.env у .gitignore) — там змінні задаються в панелі.
      # Без required:false compose падає з "env file not found".
      - path: ./backend/.env
        required: false
    environment:
      # Перебиває localhost із .env: у compose сусіди звуться іменами сервісів.
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      # Береться звідти ж, звідки створюється база, щоб не тримати той самий
      # пароль у двох файлах і не ловити розходження.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD у .env поряд з compose}
      # Не заданий — ентрипойнт згенерує один раз і збереже в томі.
      KEYRING_PW: ${KEYRING_PW:-}
    volumes:
      # Стан agy і кіраїнг із токеном підписки. Живе між перезапусками,
      # тому секрет нижче потрібен лише при першому старті.
      - agy_home:/home/app
      # Тека, а не файл: якщо монтувати відсутній файл, створюється каталог.
      - ./secrets:/run/secrets:ro,z
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  bot:
    build: ./bot
    restart: unless-stopped
    env_file:
      - path: ./bot/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  agy_home:
